          fontFamily: {

  <!-- React 18 & ReactDOM 18 -->

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 定数定義 ---
    const DEPARTMENTS = [
      'ICU', 'HCU', '４西', '４東', '６西', '６東', '７西', '７東',
      '８西', '８東', '９西', '９東', '10西', '10東',
      'はなみずみ（9階）', 'さくら（10階）', '国体町外来', '伊福町外来'
    ];

    const AGE_GROUPS = [
      '20〜24歳', '25〜29歳', '30〜34歳', '35〜39歳',
      '40〜44歳', '45〜49歳', '50〜54歳', '55〜59歳', '60歳以上'
    ];

    const INITIAL_PRESET_TASKS = [
      // 看護師用
      { id: 'd-1', name: 'バイタル・観察', category: '直接看護業務', color: '#0284c7', badgeBg: '#e0f2fe', description: 'バイタルサイン測定、状態観察、心電図チェック', targetRole: '看護師' },
      { id: 'd-2', name: '処置・点滴・採血', category: '直接看護業務', color: '#0369a1', badgeBg: '#bae6fd', description: '処置介助、注射・点滴投与、採血、創傷ケア', targetRole: '看護師' },
      { id: 'd-3', name: '生活援助・ケア', category: '直接看護業務', color: '#0f766e', badgeBg: '#ccfbf1', description: '体位変換、清拭・入浴介助、食事介助、排泄ケア', targetRole: '看護師' },
      { id: 'd-4', name: '服薬管理・指導', category: '直接看護業務', color: '#15803d', badgeBg: '#dcfce7', description: '配薬、与薬確認、患者・家族への服薬説明・指導', targetRole: '看護師' },
      { id: 'd-5', name: '医師ラウンド同行', category: '直接看護業務', color: '#4338ca', badgeBg: '#e0e7ff', description: '医師回診同行、処置補助、検査受入れ・付き添い', targetRole: '看護師' },
      { id: 'i-1', name: 'カルテ記録・入力', category: '間接看護業務', color: '#16a34a', badgeBg: '#dcfce7', description: '電子カルテ入力、経過記録、看護計画立案・評価', targetRole: '看護師' },
      { id: 'i-2', name: '情報収集・指示確認', category: '間接看護業務', color: '#059669', badgeBg: '#d1fae5', description: 'カルテ情報確認、医師指示受諾・照合、申し送り準備', targetRole: '看護師' },
      { id: 'i-3', name: '申し送り・会議', category: '間接看護業務', color: '#d97706', badgeBg: '#fef3c7', description: '朝夕申し送り、病棟カンファレンス、多職種連携会議', targetRole: '看護師' },
      { id: 'i-4', name: '物品・薬品準備', category: '間接看護業務', color: '#ca8a04', badgeBg: '#fef9c3', description: '処置車準備、配薬準備、薬品払い出し、物品補充', targetRole: '看護師' },
      { id: 'o-1', name: '移動・患者搬送', category: 'その他・管理業務', color: '#9333ea', badgeBg: '#f3e8ff', description: '病棟内移動、他部門・検査室への患者搬送', targetRole: '看護師' },
      { id: 'o-2', name: '環境整備・消毒', category: 'その他・管理業務', color: '#c026d3', badgeBg: '#fae8ff', description: 'ベッドメイク、病室清掃・換気、機材消毒・管理', targetRole: '看護師' },
      { id: 'o-3', name: '教育・指導', category: 'その他・管理業務', color: '#e11d48', badgeBg: '#ffe4e6', description: '新人看護師指導、看護学生指導、院内研修受講', targetRole: '看護師' },
      { id: 'o-4', name: '事務・電話連絡', category: 'その他・管理業務', color: '#475569', badgeBg: '#f1f5f9', description: '他部門調整、電話対応、書類作成・ファイル整理', targetRole: '看護師' },
      { id: 'o-5', name: '休憩・その他', category: 'その他・管理業務', color: '#64748b', badgeBg: '#e2e8f0', description: '昼休憩、小休憩、その他業務', targetRole: '共通' },

      // 看護補助者用
      { id: 'a-d1', name: '体位変換・移乗介助', category: '直接看護業務', color: '#0284c7', badgeBg: '#e0f2fe', description: '体位変換、車椅子・ストレッチャー移乗介助', targetRole: '看護補助者' },
      { id: 'a-d2', name: '清拭・入浴介助', category: '直接看護業務', color: '#0f766e', badgeBg: '#ccfbf1', description: '身体清拭、足浴介助、入浴・シャワー準備および介助', targetRole: '看護補助者' },
      { id: 'a-d3', name: '排泄介助・オムツ交換', category: '直接看護業務', color: '#0369a1', badgeBg: '#bae6fd', description: 'トイレ誘導、便器着脱介助、オムツ交換・処理', targetRole: '看護補助者' },
      { id: 'a-d4', name: '食事介助・配膳下膳', category: '直接看護業務', color: '#15803d', badgeBg: '#dcfce7', description: '食事配膳・回収、食事摂取補助、お茶配り・水分補給', targetRole: '看護補助者' },
      { id: 'a-d5', name: '患者搬送・誘導', category: '直接看護業務', color: '#4338ca', badgeBg: '#e0e7ff', description: '検査室・リハビリ室・手術室への患者搬送および付き添い', targetRole: '看護補助者' },
      { id: 'a-i1', name: 'ベッドメイク・リネン管理', category: '間接看護業務', color: '#16a34a', badgeBg: '#dcfce7', description: '退院床・定期ベッドメイキング、リネン類の準備・整理回収', targetRole: '看護補助者' },
      { id: 'a-i2', name: '病室清掃・環境整備', category: '間接看護業務', color: '#059669', badgeBg: '#d1fae5', description: '床頭台・ベッド周りの清掃、病室換気・ゴミ収集処分', targetRole: '看護補助者' },
      { id: 'a-i3', name: '物品・消耗品補充整理', category: '間接看護業務', color: '#ca8a04', badgeBg: '#fef9c3', description: '倉庫・中央材料室からの消耗品受入・補充・衛生材料整理', targetRole: '看護補助者' },
      { id: 'a-i4', name: '機材消毒・器具洗浄', category: '間接看護業務', color: '#d97706', badgeBg: '#fef3c7', description: '車椅子・歩行器・メディカル機器の清拭消毒、使用済み器具の洗浄', targetRole: '看護補助者' },
      { id: 'a-o1', name: 'メッセンジャー・書類搬送', category: 'その他・管理業務', color: '#9333ea', badgeBg: '#f3e8ff', description: '検体搬送、処方箋・カルテ・伝票類の中央部門への運搬', targetRole: '看護補助者' },
      { id: 'a-o2', name: '看護師補助・ナースコール一次対応', category: 'その他・管理業務', color: '#475569', badgeBg: '#f1f5f9', description: 'ナースコール一時対応・看護師への報告、業務サポート', targetRole: '看護補助者' },
    ];

    function generateDefaultTimeSlots() {
      const slots = [];
      let currentTotalMinutes = 8 * 60 + 30; // 08:30
      const endTotalMinutes = 17 * 60 + 15;  // 17:15

      while (currentTotalMinutes < endTotalMinutes) {
        const nextTotalMinutes = currentTotalMinutes + 15;
        const startH = String(Math.floor(currentTotalMinutes / 60)).padStart(2, '0');
        const startM = String(currentTotalMinutes % 60).padStart(2, '0');
        const endH = String(Math.floor(nextTotalMinutes / 60)).padStart(2, '0');
        const endM = String(nextTotalMinutes % 60).padStart(2, '0');

        slots.push({
          id: `${startH}:${startM}`,
          startTime: `${startH}:${startM}`,
          endTime: `${endH}:${endM}`,
          isOvertime: false,
          selectedTaskIds: [],
        });
        currentTotalMinutes = nextTotalMinutes;
      }
      return slots;
    }

    // モックデータ生成関数
    function generateMockRecords(count = 600) {
      const records = [];
      const currentYear = new Date().getFullYear();
      const firstNames = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤'];
      const lastNames = ['美咲', '葵', '陽菜', '七海', 'さくら', '心愛', '結衣', '凛', '芽衣', '楓'];
      const years = [currentYear - 2, currentYear - 1, currentYear];

      for (let i = 1; i <= count; i++) {
        const role = i % 5 === 0 ? '看護補助者' : '看護師';
        const department = DEPARTMENTS[i % DEPARTMENTS.length];
        const ageGroup = AGE_GROUPS[i % AGE_GROUPS.length];
        const name = `${firstNames[i % firstNames.length]} ${lastNames[(i * 3) % lastNames.length]}`;
        const targetYear = years[i % years.length];
        const month = String((i % 12) + 1).padStart(2, '0');
        const day = String((i % 28) + 1).padStart(2, '0');
        const dateStr = `${targetYear}-${month}-${day}`;

        const roleTasks = INITIAL_PRESET_TASKS.filter(
          (t) => !t.targetRole || t.targetRole === '共通' || t.targetRole === role
        );

        const defaultSlots = generateDefaultTimeSlots();
        const slots = defaultSlots.map((slot, sIndex) => {
          const selectedTaskIds = [];
          if (slot.startTime >= '12:00' && slot.startTime < '13:30' && sIndex % 4 === 0) {
            selectedTaskIds.push('o-5');
          } else if (role === '看護補助者') {
            if (sIndex % 3 === 0) selectedTaskIds.push('a-d1');
            if (sIndex % 4 === 0) selectedTaskIds.push('a-i1');
            if (sIndex % 5 === 0) selectedTaskIds.push('a-d4');
          } else {
            if (sIndex % 2 === 0) selectedTaskIds.push('d-1');
            if (sIndex % 3 === 0) selectedTaskIds.push('i-1');
            if (sIndex % 5 === 0) selectedTaskIds.push('d-2');
          }
          if (selectedTaskIds.length === 0) {
            selectedTaskIds.push(roleTasks[sIndex % roleTasks.length].id);
          }
          return { ...slot, selectedTaskIds: selectedTaskIds.slice(0, 3) };
        });

        records.push({
          id: `REC-${10000 + i}`,
          user: { name, role, department, ageGroup, targetDate: dateStr },
          submittedAt: new Date(`${dateStr}T17:15:00`).toISOString(),
          slots,
        });
      }
      return records;
    }

    // CSV出力関数
    function exportRecordsToCSV(records, filename = '看護部タイムスタディ集計データ.csv') {
      if (!records || records.length === 0) {
        alert('出力対象のデータが存在しません。');
        return;
      }
      const taskMap = new Map(INITIAL_PRESET_TASKS.map((t) => [t.id, t.name]));
      const headers = ['提出ID', '調査対象日', '氏名', '職種', '部署', '年齢層', '開始時間', '終了時間', '区分(時間外)', '選択業務1', '選択業務2', '選択業務3', '提出日時'];
      const rows = [];

      records.forEach((record) => {
        record.slots.forEach((slot) => {
          const taskNames = slot.selectedTaskIds.map((id) => taskMap.get(id) || id);
          rows.push([
            record.id,
            record.user.targetDate,
            `"${record.user.name.replace(/"/g, '""')}"`,
            `"${record.user.role || '看護師'}"`,
            `"${record.user.department}"`,
            `"${record.user.ageGroup}"`,
            slot.startTime,
            slot.endTime,
            slot.isOvertime ? (slot.overtimeType === 'early' ? '早出' : '残業') : '通常',
            `"${taskNames[0] || ''}"`,
            `"${taskNames[1] || ''}"`,
            `"${taskNames[2] || ''}"`,
            record.submittedAt,
          ]);
        });
      });

      const csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.map((r) => r.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // --- メインコンポーネント (App) ---
    function App() {
      const [activeTab, setActiveTab] = useState('input'); // 'input' | 'admin'
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('nurse_timestudy_user_profile');
        return saved ? JSON.parse(saved) : null;
      });
      const [showUserSetupModal, setShowUserSetupModal] = useState(!user);
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('nurse_timestudy_custom_tasks');
        return saved ? JSON.parse(saved) : INITIAL_PRESET_TASKS;
      });
      const [slots, setSlots] = useState(() => {
        const saved = localStorage.getItem('nurse_timestudy_draft_slots');
        return saved ? JSON.parse(saved) : generateDefaultTimeSlots();
      });
      const [activeSlot, setActiveSlot] = useState(null);
      const [allRecords, setAllRecords] = useState(() => {
        const saved = localStorage.getItem('nurse_timestudy_all_submitted_records');
        return saved ? JSON.parse(saved) : [];
      });
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminAuthModal, setShowAdminAuthModal] = useState(false);

      const handleSaveUser = (updatedUser) => {
        setUser(updatedUser);
        localStorage.setItem('nurse_timestudy_user_profile', JSON.stringify(updatedUser));
        setShowUserSetupModal(false);
      };

      const handleDeleteUserProfile = () => {
        localStorage.removeItem('nurse_timestudy_user_profile');
        localStorage.removeItem('nurse_timestudy_draft_slots');
        setUser(null);
        setSlots(generateDefaultTimeSlots());
        setShowUserSetupModal(true);
        alert('登録情報および一時保存データを削除しました。');
      };

      const handleSaveSlotTasks = (slotId, taskIds) => {
        const updated = slots.map((s) => (s.id === slotId ? { ...s, selectedTaskIds: taskIds } : s));
        setSlots(updated);
        localStorage.setItem('nurse_timestudy_draft_slots', JSON.stringify(updated));
        setActiveSlot(null);
      };

      const handleSubmitTimeStudy = () => {
        if (!user) {
          setShowUserSetupModal(true);
          return;
        }
        const unassigned = slots.filter((s) => s.selectedTaskIds.length === 0).length;
        if (unassigned > 0) {
          if (!window.confirm(`未入力のコマが ${unassigned} 件あります。このまま送信しますか？`)) return;
        }
        const newRecord = {
          id: `SUB-${Date.now().toString().slice(-6)}`,
          user,
          submittedAt: new Date().toLocaleString('ja-JP'),
          slots,
        };
        const updatedRecords = [newRecord, ...allRecords];
        setAllRecords(updatedRecords);
        localStorage.setItem('nurse_timestudy_all_submitted_records', JSON.stringify(updatedRecords));
        localStorage.removeItem('nurse_timestudy_draft_slots');
        setSlots(generateDefaultTimeSlots());

        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        alert('タイムスタディの提出が完了しました！ご協力ありがとうございました。');
      };

      const handleAddTask = (newTask) => {
        const updated = [...tasks, newTask];
        setTasks(updated);
        localStorage.setItem('nurse_timestudy_custom_tasks', JSON.stringify(updated));
      };

      const handleDeleteTask = (taskId) => {
        const updated = tasks.filter((t) => t.id !== taskId);
        setTasks(updated);
        localStorage.setItem('nurse_timestudy_custom_tasks', JSON.stringify(updated));
      };

      const handleGenerateMockData = () => {
        const mock = generateMockRecords(600);
        setAllRecords(mock);
        localStorage.setItem('nurse_timestudy_all_submitted_records', JSON.stringify(mock));
        alert('看護師・看護補助者を含む600人規模の複数年サンプルデータを生成しました！');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* 共通ヘッダー */}
          <header className="bg-slate-900 text-white shadow-md">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-sky-600 flex items-center justify-center font-bold text-xl shadow">
                  ⏱️
                </div>
                <div>
                  <h1 className="text-lg font-bold leading-tight">看護部 タイムスタディ</h1>
                  <p className="text-xs text-slate-400">業務時間・行動調査システム</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                {user ? (
                  <button
                    onClick={() => setShowUserSetupModal(true)}
                    className="flex items-center space-x-2 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition"
                  >
                    <span className="text-sm font-semibold">{user.name}</span>
                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${user.role === '看護補助者' ? 'bg-emerald-500 text-white' : 'bg-sky-500 text-white'}`}>
                      {user.role}
                    </span>
                    <span className="text-xs text-slate-400">({user.department})</span>
                  </button>
                ) : (
                  <button
                    onClick={() => setShowUserSetupModal(true)}
                    className="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold"
                  >
                    ユーザー属性設定
                  </button>
                )}

                <button
                  onClick={() => {
                    if (isAdminAuthenticated) setActiveTab('admin');
                    else setShowAdminAuthModal(true);
                  }}
                  className={`text-xs px-3 py-1.5 rounded-lg font-bold flex items-center space-x-1 transition ${
                    isAdminAuthenticated ? 'bg-purple-600 text-white' : 'bg-amber-600 text-white'
                  }`}
                >
                  <span>{isAdminAuthenticated ? '🔓 管理コンソール' : '🔒 管理者ログイン'}</span>
                </button>
              </div>
            </div>

            {/* ナビタブ */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-2 text-sm border-t border-slate-800 pt-1">
              <button
                onClick={() => setActiveTab('input')}
                className={`px-4 py-2 font-bold border-b-2 transition ${
                  activeTab === 'input' ? 'border-sky-500 text-sky-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                タイムスタディ入力 ({user ? user.role : '看護部'})
              </button>
              {isAdminAuthenticated && (
                <button
                  onClick={() => setActiveTab('admin')}
                  className={`px-4 py-2 font-bold border-b-2 transition ${
                    activeTab === 'admin' ? 'border-purple-500 text-purple-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  管理画面（集計・分析・設定）
                </button>
              )}
            </div>
          </header>

          {/* メインビュー */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'input' && (
              <TimelineView
                user={user}
                slots={slots}
                setSlots={setSlots}
                onSlotClick={(slot) => setActiveSlot(slot)}
                onSubmit={handleSubmitTimeStudy}
              />
            )}

            {activeTab === 'admin' && isAdminAuthenticated && (
              <AdminConsoleView
                records={allRecords}
                setAllRecords={setAllRecords}
                tasks={tasks}
                onAddTask={handleAddTask}
                onDeleteTask={handleDeleteTask}
                onGenerateMock={handleGenerateMockData}
                onLogout={() => {

    // --- タイムライン表示ビュー ---
    function TimelineView({ user, slots, setSlots, onSlotClick, onSubmit }) {
      const assignedCount = slots.filter((s) => s.selectedTaskIds.length > 0).length;
      const progressPercent = Math.round((assignedCount / slots.length) * 100);

      const handleAddEarlySlot = () => {
        const first = slots[0];
        const [h, m] = first.startTime.split(':').map(Number);
        let totalM = h * 60 + m - 15;
        if (totalM < 0) totalM += 1440;
        const startH = String(Math.floor(totalM / 60)).padStart(2, '0');
        const startM = String(totalM % 60).padStart(2, '0');
        const newSlot = {
          id: `early-${startH}:${startM}`,
          startTime: `${startH}:${startM}`,
          endTime: first.startTime,
          isOvertime: true,
          overtimeType: 'early',
          selectedTaskIds: [],
        };
        const updated = [newSlot, ...slots];
        setSlots(updated);
        localStorage.setItem('nurse_timestudy_draft_slots', JSON.stringify(updated));
      };

      const handleAddLateSlot = () => {
        const last = slots[slots.length - 1];
        const [h, m] = last.endTime.split(':').map(Number);
        const totalM = h * 60 + m + 15;
        const endH = String(Math.floor(totalM / 60)).padStart(2, '0');
        const endM = String(totalM % 60).padStart(2, '0');
        const newSlot = {
          id: `late-${last.endTime}`,
          startTime: last.endTime,
          endTime: `${endH}:${endM}`,
          isOvertime: true,
          overtimeType: 'late',
          selectedTaskIds: [],
        };
        const updated = [...slots, newSlot];
        setSlots(updated);
        localStorage.setItem('nurse_timestudy_draft_slots', JSON.stringify(updated));
      };

      return (
        <div className="space-y-6">
          {/* ステータスバー */}
          <div className="glass-card rounded-2xl p-5 border border-slate-200">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-bold px-2.5 py-1 rounded bg-sky-100 text-sky-800">
                    対象日: {user?.targetDate || '本日'}
                  </span>
                  <span className={`text-xs font-bold px-2.5 py-1 rounded ${user?.role === '看護補助者' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}`}>
                    職種: {user?.role || '未設定'}
                  </span>
                </div>
                <h2 className="text-xl font-bold mt-2">15分単位 行動・業務入力</h2>
                <p className="text-xs text-slate-500">コマを選択し、該当時間に行った業務（最大3つ）を選択してください。</p>
              </div>

              <div className="flex items-center space-x-4">
                <div className="text-right">
                  <div className="text-xs text-slate-500 font-semibold">入力進捗</div>
                  <div className="text-lg font-bold text-sky-600">{assignedCount} / {slots.length} コマ ({progressPercent}%)</div>
                </div>
                <button
                  onClick={onSubmit}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-95"
                >
                  調査完了・送信
                </button>
              </div>
            </div>

            {/* 進捗プログレスバー */}
            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden mt-4">
              <div className="bg-sky-500 h-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
            </div>
          </div>

          {/* 早出追加ボタン */}
          <div className="text-center">
            <button
              onClick={handleAddEarlySlot}
              className="text-xs font-bold text-sky-600 bg-sky-50 hover:bg-sky-100 border border-sky-200 px-4 py-2 rounded-full transition"
            >
              ＋ 早出時間枠（8:30以前）を追加
            </button>
          </div>

          {/* タイムライングリッド */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {slots.map((slot) => {
              const isFilled = slot.selectedTaskIds.length > 0;
              return (
                <div
                  key={slot.id}
                  onClick={() => onSlotClick(slot)}
                  className={`p-3.5 rounded-xl border transition cursor-pointer flex items-center justify-between ${
                    slot.isOvertime
                      ? 'bg-purple-50/60 border-purple-200 hover:border-purple-400'
                      : isFilled
                      ? 'bg-white border-sky-300 shadow-sm hover:border-sky-500'
                      : 'bg-slate-50/80 border-slate-200 hover:bg-white hover:border-slate-300'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <div className={`text-xs font-bold px-2 py-1 rounded ${slot.isOvertime ? 'bg-purple-200 text-purple-800' : 'bg-slate-200 text-slate-700'}`}>
                      {slot.startTime} - {slot.endTime}
                    </div>
                    {slot.isOvertime && <span className="text-[10px] bg-purple-600 text-white font-bold px-1.5 py-0.5 rounded">時間外</span>}
                  </div>

                  <div className="flex items-center space-x-1.5">
                    {isFilled ? (
                      <span className="text-xs font-bold text-sky-700 bg-sky-50 border border-sky-200 px-2 py-1 rounded-md">
                        {slot.selectedTaskIds.length}件 選択済み
                      </span>
                    ) : (
                      <span className="text-xs text-slate-400 font-medium">未入力 ＋</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* 残業追加ボタン */}
          <div className="text-center pt-2">
            <button
              onClick={handleAddLateSlot}
              className="text-xs font-bold text-purple-600 bg-purple-50 hover:bg-purple-100 border border-purple-200 px-4 py-2 rounded-full transition"
            >
              ＋ 残業時間枠（17:15以降）を追加
            </button>
          </div>
        </div>
      );
    }

    // --- 業務項目選択モーダル ---

      const [selectedIds, setSelectedIds] = useState([...slot.selectedTaskIds]);

      const availableTasks = tasks.filter(
        (t) => !t.targetRole || t.targetRole === '共通' || t.targetRole === userRole
      );

      const otherTasks = availableTasks.filter((t) => t.category === 'その他・管理業務');

      const toggleTask = (taskId) => {
        if (selectedIds.includes(taskId)) {
          setSelectedIds(selectedIds.filter((id) => id !== taskId));
        } else {
          if (selectedIds.length >= 3) {
            alert('15分のコマで選択できる業務は最大3つまでです。');
            return;

          setSelectedIds([...selectedIds, taskId]);

              {/* 間接看護業務 */}

                {tabKey === 'master' && '⚙️ 定型業務マスタ編集'}
                {tabKey === 'data' && '🗑️ データ管理・モック生成'}
              </button>
            ))}
          </div>

          {/* 1. 集計ダッシュボード */}
          {subTab === 'dashboard' && (
            <div className="space-y-6">
              {/* フィルターバー */}
              <div className="bg-white p-4 rounded-xl border shadow-sm flex flex-wrap items-center gap-4">
                <div>
                  <label className="text-xs text-slate-500 font-bold mr-2">職種絞り込み:</label>
                  <select value={roleFilter} onChange={(e) => setRoleFilter(e.target.value)} className="p-2 border rounded-lg text-xs font-bold">
                    <option value="ALL">全職種 (全体)</option>
                    <option value="看護師">看護師</option>
                    <option value="看護補助者">看護補助者</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-500 font-bold mr-2">部署絞り込み:</label>
                  <select value={deptFilter} onChange={(e) => setDeptFilter(e.target.value)} className="p-2 border rounded-lg text-xs font-bold">
                    <option value="ALL">全18部署 (全体)</option>
                    {DEPARTMENTS.map((d) => <option key={d} value={d}>{d}</option>)}
                  </select>
                </div>
                <div className="ml-auto flex items-center space-x-2">
                  <span className="text-xs text-slate-500 font-bold">対象: {filteredRecords.length} 件</span>
                  <button onClick={() => exportRecordsToCSV(filteredRecords)} className="bg-emerald-600 text-white font-bold text-xs px-3 py-2 rounded-lg hover:bg-emerald-500">
                    📥 CSVデータ出力
                  </button>
                </div>
              </div>

              {/* 集計テーブル */}
              <div className="bg-white rounded-xl border shadow-sm p-4 overflow-x-auto">
                <h3 className="font-bold text-sm text-slate-800 mb-3">提出レコード一覧 (最新50件)</h3>
                <table className="w-full text-xs text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-100 text-slate-600 border-b">
                      <th className="p-2.5">氏名</th>
                      <th className="p-2.5">職種</th>
                      <th className="p-2.5">部署</th>
                      <th className="p-2.5">年齢層</th>
                      <th className="p-2.5">対象日</th>
                      <th className="p-2.5">提出日時</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredRecords.slice(0, 50).map((r) => (
                      <tr key={r.id} className="border-b hover:bg-slate-50">
                        <td className="p-2.5 font-bold">{r.user.name}</td>
                        <td className="p-2.5">
                          <span className={`px-2 py-0.5 rounded font-bold ${r.user.role === '看護補助者' ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800'}`}>
                            {r.user.role || '看護師'}
                          </span>
                        </td>
                        <td className="p-2.5">{r.user.department}</td>
                        <td className="p-2.5">{r.user.ageGroup}</td>
                        <td className="p-2.5">{r.user.targetDate}</td>
                        <td className="p-2.5 text-slate-400">{r.submittedAt}</td>
                      </tr>
                    ))}
                    {filteredRecords.length === 0 && (
                      <tr><td colSpan="6" className="p-6 text-center text-slate-400">提出データが存在しません。</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* 2. 部署別提出進捗 */}
          {subTab === 'progress' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {DEPARTMENTS.map((dept) => {
                const count = filteredRecords.filter((r) => r.user.department === dept).length;
                const target = dept === 'ICU' || dept === 'HCU' ? 25 : 35;
                const pct = Math.min(100, Math.round((count / target) * 100));

                return (
                  <div key={dept} className="bg-white p-4 rounded-xl border shadow-sm space-y-2">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-sm">{dept}</span>
                      <span className="text-xs font-bold text-slate-500">{count} / {target} 名</span>
                    </div>
                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                      <div className="bg-purple-600 h-full transition-all" style={{ width: `${pct}%` }}></div>
                    </div>
                    <div className="text-right text-[11px] font-bold text-purple-700">進捗率: {pct}%</div>
                  </div>
                );
              })}
            </div>
          )}

          {/* 3. マスタ編集 */}
          {subTab === 'master' && (
            <MasterEditor tasks={tasks} onAddTask={onAddTask} onDeleteTask={onDeleteTask} />
          )}

          {/* 4. データ管理 */}
          {subTab === 'data' && (
            <div className="bg-white p-6 rounded-xl border space-y-4 max-w-lg">
              <h3 className="font-bold text-base text-slate-900 border-b pb-2">データ管理・モック生成</h3>
              <p className="text-xs text-slate-500">デモ検証用のサンプルデータを生成するか、全データを消去します。</p>
              <div className="space-y-3 pt-2">
                <button onClick={onGenerateMock} className="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-3 rounded-xl text-xs">
                  ⚡ 600人規模のサンプル集計データを生成 (複数年・看護師/補助者含む)
                </button>
                <button
                  onClick={() => {
                    if (window.confirm('すべての提出データを完全消去します。よろしいですか？')) {
                      setAllRecords([]);
                      localStorage.removeItem('nurse_timestudy_all_submitted_records');
                      alert('削除完了しました。');
                    }
                  }}
                  className="w-full bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-bold p-3 rounded-xl text-xs"
                >
                  🗑️ 全提出データを削除
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- マスタ編集ビュー ---
    function MasterEditor({ tasks, onAddTask, onDeleteTask }) {
      const [name, setName] = useState('');
      const [cat, setCat] = useState('直接看護業務');
      const [targetRole, setTargetRole] = useState('看護師');
      const [desc, setDesc] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        let color = '#0284c7';
        let badgeBg = '#e0f2fe';
        if (cat === '間接看護業務') { color = '#10b981'; badgeBg = '#d1fae5'; }
        else if (cat === 'その他・管理業務') { color = '#a855f7'; badgeBg = '#f3e8ff'; }

        onAddTask({
          id: `custom-${Date.now()}`,
          name: name.trim(),
          category: cat,
          color,
          badgeBg,
          description: desc.trim() || 'カスタム追加項目',
          targetRole,
        });
        setName('');
        setDesc('');
        alert(`新規業務「${name}」を追加しました！`);
      };

      return (
        <div className="space-y-6">
          <form onSubmit={handleSubmit} className="bg-white p-5 rounded-xl border space-y-4">
            <h4 className="font-bold text-sm text-slate-800">＋ 新しい定型業務項目を追加</h4>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label className="text-xs font-bold text-slate-600">対象職種</label>
                <select value={targetRole} onChange={(e) => setTargetRole(e.target.value)} className="w-full p-2 border rounded-lg text-xs font-bold">
                  <option value="看護師">🩺 看護師専用</option>
                  <option value="看護補助者">🤝 看護補助者専用</option>
                  <option value="共通">🌐 全職種共通</option>
                </select>
              </div>
              <div>
                <label className="text-xs font-bold text-slate-600">業務名</label>
                <input type="text" required placeholder="例: 回診補助" value={name} onChange={(e) => setName(e.target.value)} className="w-full p-2 border rounded-lg text-xs" />
              </div>
              <div>
                <label className="text-xs font-bold text-slate-600">業務カテゴリ</label>
                <select value={cat} onChange={(e) => setCat(e.target.value)} className="w-full p-2 border rounded-lg text-xs">
                  <option value="直接看護業務">🟦 直接看護業務</option>
                  <option value="間接看護業務">🟩 間接看護業務</option>
                  <option value="その他・管理業務">🟧 その他・管理業務</option>
                </select>
              </div>
            </div>
            <div>
              <label className="text-xs font-bold text-slate-600">補足説明</label>
              <input type="text" placeholder="詳細説明" value={desc} onChange={(e) => setDesc(e.target.value)} className="w-full p-2 border rounded-lg text-xs" />
            </div>
            <button type="submit" className="bg-purple-600 text-white font-bold text-xs px-4 py-2 rounded-lg">定型業務マスタに追加</button>
          </form>

          {/* 一覧 */}
          <div className="bg-white p-5 rounded-xl border space-y-3">
            <h4 className="font-bold text-sm text-slate-800">登録済み定型業務一覧 ({tasks.length}件)</h4>
            <div className="space-y-2 max-h-96 overflow-y-auto">
              {tasks.map((t) => (
                <div key={t.id} className="p-3 border rounded-lg flex items-center justify-between hover:bg-slate-50">
                  <div className="flex items-center space-x-2">
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded" style={{ backgroundColor: t.badgeBg, color: t.color }}>{t.category}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${t.targetRole === '看護補助者' ? 'bg-emerald-100 text-emerald-800' : 'bg-sky-100 text-sky-800'}`}>
                      {t.targetRole || '看護師'}
                    </span>
                    <span className="font-bold text-sm text-slate-800">{t.name}</span>
                    <span className="text-xs text-slate-400">{t.description}</span>
                  </div>
                  <button onClick={() => onDeleteTask(t.id)} className="text-red-500 text-xs font-bold hover:underline">削除</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // React アプリレンダリング
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
